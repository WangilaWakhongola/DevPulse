<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevPulse — GitHub Activity Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; color: var(--accent); }
    header span { color: var(--muted); font-size: 0.85rem; }

    /* ── Search ── */
    .search-bar {
      max-width: 700px;
      margin: 40px auto 32px;
      padding: 0 20px;
      display: flex;
      gap: 10px;
    }
    .search-bar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    .search-bar button:hover { opacity: 0.85; }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    .hidden { display: none !important; }

    /* ── Error ── */
    #error-box {
      background: #2a1215;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 14px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    /* ── Profile Card ── */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 28px;
    }
    .profile-card img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .profile-info h2 { font-size: 1.4rem; }
    .profile-info .login { color: var(--muted); margin-bottom: 6px; }
    .profile-info .bio { color: var(--text); margin: 8px 0; font-size: 0.92rem; }
    .profile-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
    .profile-meta span { color: var(--muted); font-size: 0.85rem; }
    .profile-meta span strong { color: var(--text); }
    .profile-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
    }

    /* ── Grid ── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Section Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }
    .card h3 {
      font-size: 1rem;
      margin-bottom: 18px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.78rem;
    }

    /* ── Stat Tiles ── */
    .stat-tiles {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .stat-tile {
      flex: 1;
      min-width: 120px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }
    .stat-tile .val { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .stat-tile .lbl { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

    /* ── Language Bars ── */
    .lang-bar { margin-bottom: 12px; }
    .lang-bar .lang-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .lang-bar .bar-track {
      background: var(--border);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }
    .lang-bar .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* ── Repo Cards ── */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .repo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .repo-card a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.95rem; }
    .repo-card a:hover { text-decoration: underline; }
    .repo-card .desc { color: var(--muted); font-size: 0.83rem; flex: 1; }
    .repo-card .meta { display: flex; gap: 14px; font-size: 0.8rem; color: var(--muted); }
    .repo-card .topics { display: flex; flex-wrap: wrap; gap: 6px; }
    .repo-card .topic {
      background: #1f3a52;
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    /* ── Activity Feed ── */
    .activity-list { display: flex; flex-direction: column; gap: 10px; }
    .activity-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .activity-item .summary { font-size: 0.88rem; }
    .activity-item .time { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }

    /* ── Loader ── */
    .loader {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>DevPulse</h1>
  <span>GitHub Activity Dashboard</span>
</header>

<div class="search-bar">
  <input type="text" id="username-input" placeholder="Enter a GitHub username..." />
  <button id="search-btn">Search</button>
</div>

<main>
  <div id="error-box" class="hidden"></div>
  <div id="loader" class="hidden loader">
    <div class="spinner"></div>
    <p>Loading profile...</p>
  </div>

  <div id="dashboard" class="hidden">
    <!-- Profile -->
    <div class="profile-card" id="profile-card"></div>

    <!-- Stat tiles -->
    <div class="stat-tiles" id="stat-tiles"></div>

    <!-- Languages + Activity -->
    <div class="grid-2">
      <div class="card">
        <h3>Language Breakdown</h3>
        <div id="lang-bars"></div>
      </div>
      <div class="card">
        <h3>Recent Activity</h3>
        <div class="activity-list" id="activity-list"></div>
      </div>
    </div>

    <!-- Repos -->
    <h3 style="margin-bottom:14px; color:var(--muted); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em;">
      Top Repositories
    </h3>
    <div class="repo-grid" id="repo-grid"></div>
  </div>
</main>

<script>
  const input   = document.getElementById("username-input");
  const btn     = document.getElementById("search-btn");
  const loader  = document.getElementById("loader");
  const dash    = document.getElementById("dashboard");
  const errBox  = document.getElementById("error-box");

  btn.addEventListener("click", search);
  input.addEventListener("keydown", e => { if (e.key === "Enter") search(); });

  async function search() {
    const username = input.value.trim();
    if (!username) return;
    showLoader();

    try {
      const [profileRes, reposRes, activityRes, statsRes] = await Promise.all([
        fetch(`/api/github/${username}/profile`).then(r => r.json()),
        fetch(`/api/github/${username}/repos?limit=6`).then(r => r.json()),
        fetch(`/api/github/${username}/activity`).then(r => r.json()),
        fetch(`/api/github/${username}/stats`).then(r => r.json()),
      ]);

      if (!profileRes.success) throw new Error(profileRes.error);

      renderProfile(profileRes.data);
      renderStats(statsRes.data);
      renderLanguages(statsRes.data?.languages || []);
      renderRepos(reposRes.data || []);
      renderActivity(activityRes.data || []);

      showDashboard();
    } catch (err) {
      showError(err.message || "Something went wrong.");
    }
  }

  function renderProfile(p) {
    document.getElementById("profile-card").innerHTML = `
      <img src="${p.avatar_url}" alt="${p.login}" />
      <div class="profile-info">
        <h2>${p.name || p.login}</h2>
        <div class="login">@${p.login}</div>
        ${p.bio ? `<div class="bio">${p.bio}</div>` : ""}
        <div class="profile-meta">
          <span><strong>${p.followers}</strong> Followers</span>
          <span><strong>${p.following}</strong> Following</span>
          <span><strong>${p.public_repos}</strong> Repos</span>
          ${p.location ? `<span>${p.location}</span>` : ""}
        </div>
        <a class="profile-link" href="${p.html_url}" target="_blank">View on GitHub →</a>
      </div>`;
  }

  function renderStats(s) {
    if (!s) return;
    document.getElementById("stat-tiles").innerHTML = `
      <div class="stat-tile"><div class="val">${s.total_repos}</div><div class="lbl">Repositories</div></div>
      <div class="stat-tile"><div class="val">${s.total_stars}</div><div class="lbl">Total Stars</div></div>
      <div class="stat-tile"><div class="val">${s.total_forks}</div><div class="lbl">Total Forks</div></div>
      <div class="stat-tile"><div class="val">${s.languages.length}</div><div class="lbl">Languages</div></div>`;
  }

  function renderLanguages(langs) {
    const max = langs[0]?.count || 1;
    document.getElementById("lang-bars").innerHTML = langs.slice(0, 8).map(l => `
      <div class="lang-bar">
        <div class="lang-label"><span>${l.name}</span><span>${l.count} repo${l.count !== 1 ? "s" : ""}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(l.count / max * 100)}%"></div></div>
      </div>`).join("") || "<p style='color:var(--muted);font-size:0.85rem'>No language data.</p>";
  }

  function renderRepos(repos) {
    document.getElementById("repo-grid").innerHTML = repos.map(r => `
      <div class="repo-card">
        <a href="${r.html_url}" target="_blank">${r.name}</a>
        <div class="desc">${r.description || "No description provided."}</div>
        ${r.topics.length ? `<div class="topics">${r.topics.slice(0,4).map(t => `<span class="topic">${t}</span>`).join("")}</div>` : ""}
        <div class="meta">
          ${r.language ? `<span>${r.language}</span>` : ""}
          <span>★ ${r.stargazers_count}</span>
          <span>⑂ ${r.forks_count}</span>
        </div>
      </div>`).join("") || "<p style='color:var(--muted);font-size:0.85rem'>No repositories found.</p>";
  }

  function renderActivity(events) {
    document.getElementById("activity-list").innerHTML = events.slice(0, 10).map(e => `
      <div class="activity-item">
        <div class="summary">${e.payload_summary}</div>
        <div class="time">${new Date(e.created_at).toLocaleString()}</div>
      </div>`).join("") || "<p style='color:var(--muted);font-size:0.85rem'>No recent activity.</p>";
  }

  function showLoader() {
    errBox.classList.add("hidden");
    dash.classList.add("hidden");
    loader.classList.remove("hidden");
  }
  function showDashboard() {
    loader.classList.add("hidden");
    dash.classList.remove("hidden");
  }
  function showError(msg) {
    loader.classList.add("hidden");
    errBox.textContent = "Error: " + msg;
    errBox.classList.remove("hidden");
  }
</script>
</body>
</html>
